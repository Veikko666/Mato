<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mato luolassa</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: rgba(12, 18, 26, 0.92);
    --text: #e8f0f7;
    --muted: #8ea2b5;
    --accent: #7ee36b;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #hud {
    position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 10px 16px;
    font-weight: 700; font-size: 20px; pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,.6);
  }
  #hud .best { color: var(--muted); font-weight: 600; }
  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(0,0,0,.35);
  }
  .overlay.hidden { display: none; }
  .panel {
    width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto;
    background: var(--panel); border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px; padding: 20px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  h1 { margin: 0 0 4px; font-size: 30px; color: var(--accent); letter-spacing: .5px; }
  h2 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 6px 0; color: var(--muted); line-height: 1.4; }
  .score-big { font-size: 44px; font-weight: 800; color: var(--text); margin: 4px 0 8px; }
  button {
    font: inherit; font-weight: 700; font-size: 18px; cursor: pointer;
    border: 0; border-radius: 12px; padding: 14px 18px; width: 100%; margin-top: 10px;
    background: var(--accent); color: #0b1a07; touch-action: manipulation;
  }
  button.secondary { background: rgba(255,255,255,.1); color: var(--text); }
  input {
    font: inherit; font-size: 18px; width: 100%; padding: 12px; margin-top: 8px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.4); color: var(--text); text-align: center;
    -webkit-user-select: text; user-select: text;
  }
  ol { list-style: none; padding: 0; margin: 12px 0 0; text-align: left; counter-reset: rank; }
  ol li {
    counter-increment: rank; display: flex; gap: 10px; padding: 7px 10px;
    border-radius: 8px; font-size: 16px;
  }
  ol li:nth-child(odd) { background: rgba(255,255,255,.04); }
  ol li::before { content: counter(rank) "."; width: 26px; color: var(--muted); }
  ol li .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol li .s { font-weight: 700; font-variant-numeric: tabular-nums; }
  ol li.me { background: rgba(126,227,107,.18); color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 10px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" hidden><span id="score">0</span><span class="best" id="best">Ennätys 0</span></div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>Mato luolassa</h1>
    <p>Pidä sormi näytöllä, niin mato nousee. Päästä irti, niin se laskee.</p>
    <p>Väistä seiniä – luola kapenee koko ajan!</p>
    <button id="startBtn">Aloita</button>
    <button class="secondary" id="scoresBtn">Top 10</button>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="panel">
    <h2>Törmäsit!</h2>
    <div class="score-big" id="finalScore">0</div>
    <div id="nameForm" hidden>
      <p>Pääsit top 10 -listalle! Kirjoita nimesi:</p>
      <input id="nameInput" maxlength="16" autocomplete="off" placeholder="Nimi">
      <button id="saveBtn">Tallenna</button>
    </div>
    <div id="overButtons">
      <button id="againBtn">Uudestaan</button>
      <button class="secondary" id="overScoresBtn">Top 10</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="scores">
  <div class="panel">
    <h2>Top 10</h2>
    <ol id="scoreList"></ol>
    <button id="scoresPlayBtn">Pelaa</button>
    <button class="secondary" id="scoresBackBtn">Takaisin</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Tallennus ----------
  const STORE_KEY = 'mato-luola-top10';
  const LAST_NAME_KEY = 'mato-luola-nimi';

  function loadScores() {
    try {
      const list = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      return Array.isArray(list) ? list.filter(e => e && typeof e.score === 'number').slice(0, 10) : [];
    } catch { return []; }
  }
  function saveScores(list) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch {}
  }
  function qualifies(score) {
    const list = loadScores();
    return score > 0 && (list.length < 10 || score > list[list.length - 1].score);
  }
  function addScore(name, score) {
    const list = loadScores();
    const entry = { name, score, date: Date.now() };
    list.push(entry);
    list.sort((a, b) => b.score - a.score || a.date - b.date);
    const top = list.slice(0, 10);
    saveScores(top);
    return top.indexOf(entry);
  }
  function bestScore() {
    const list = loadScores();
    return list.length ? list[0].score : 0;
  }

  // ---------- Canvas ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  // Pelimaailma on aina 1000 yksikköä korkea, leveys riippuu näytön muodosta.
  const WORLD_H = 1000;
  let worldW = 1600, scale = 1, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    scale = canvas.height / WORLD_H;
    worldW = canvas.width / scale;
    if (state !== 'playing') resetWorld();
  }

  // ---------- Pelin parametrit ----------
  const SEG_W = 20;            // luolan palan leveys
  const HEAD_R = 14;           // pään säde
  const BODY_LEN = 260;        // vartalon pituus vaakasuunnassa
  const GRAVITY = 1500;        // alaspäin kun ei paineta
  const THRUST = 1500;         // ylöspäin kun painetaan
  const MAX_VY = 600;
  const START_GAP = 620;
  const MIN_GAP = 150;
  const START_SPEED = 380;
  const MAX_SPEED = 720;

  let state = 'menu';          // menu | playing | over
  let pressing = false;
  let cave = [];               // {x, top, bot}
  let blocks = [];             // esteet luolan sisällä {x, y, w, h}
  let trail = [];              // pään historia {x, y}
  let particles = [];
  let head, vy, distance, elapsed, speed, gap, center, centerVel, nextBlockAt;
  let score = 0, lastTime = 0, shake = 0;

  const headX = () => Math.min(worldW * 0.25, 420);

  function resetWorld() {
    cave = []; blocks = []; trail = []; particles = [];
    distance = 0; elapsed = 0; speed = START_SPEED; gap = START_GAP;
    center = WORLD_H / 2; centerVel = 0; nextBlockAt = 2500;
    vy = 0; score = 0; shake = 0;
    head = { x: headX(), y: WORLD_H / 2 };
    for (let x = 0; x <= worldW + SEG_W * 2; x += SEG_W) pushSegment(x, true);
    for (let x = head.x - BODY_LEN; x <= head.x; x += 4) trail.push({ x, y: head.y });
  }

  function pushSegment(x, calm) {
    if (!calm) {
      // Luolan keskikohta vaeltaa satunnaisesti, jyrkemmin kun peli etenee.
      const wild = 0.6 + Math.min(elapsed / 60, 1.4);
      centerVel += (Math.random() - 0.5) * 9 * wild;
      centerVel *= 0.94;
      const maxVel = 10 + 14 * Math.min(elapsed / 60, 1);
      centerVel = Math.max(-maxVel, Math.min(maxVel, centerVel));
      center += centerVel;
    }
    const margin = 30 + gap / 2;
    if (center < margin) { center = margin; centerVel = Math.abs(centerVel); }
    if (center > WORLD_H - margin) { center = WORLD_H - margin; centerVel = -Math.abs(centerVel); }
    // Pieni rosoisuus seiniin.
    const jag = calm ? 0 : 6;
    cave.push({
      x,
      top: center - gap / 2 + (Math.random() - 0.5) * jag,
      bot: center + gap / 2 + (Math.random() - 0.5) * jag,
    });

    // Esteitä luolan keskelle pelin edetessä.
    if (!calm && distance + x > nextBlockAt && elapsed > 8) {
      const h = Math.min(60 + elapsed * 1.5, gap * 0.38);
      const room = gap - h - HEAD_R * 6;
      if (room > 0) {
        const y = center - gap / 2 + HEAD_R * 3 + Math.random() * room;
        blocks.push({ x, y, w: SEG_W * 1.5, h });
      }
      nextBlockAt = distance + x + 900 + Math.random() * 900 - Math.min(elapsed * 6, 500);
    }
  }

  function caveAt(x) {
    // Interpoloi seinien korkeus kohdassa x.
    for (let i = 0; i < cave.length - 1; i++) {
      const a = cave[i], b = cave[i + 1];
      if (x >= a.x && x <= b.x) {
        const t = (x - a.x) / (b.x - a.x);
        return { top: a.top + (b.top - a.top) * t, bot: a.bot + (b.bot - a.bot) * t };
      }
    }
    return { top: 0, bot: WORLD_H };
  }

  // ---------- Ohjaus ----------
  function press(e) {
    if (state !== 'playing') return;
    if (e) e.preventDefault();
    pressing = true;
  }
  function release() { pressing = false; }
  canvas.addEventListener('pointerdown', press);
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('blur', release);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      if (state === 'playing') { press(e); }
      else if (state === 'menu' && !document.getElementById('menu').classList.contains('hidden')) { e.preventDefault(); startGame(); }
    }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') release(); });
  document.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- Pelisilmukka ----------
  function update(dt) {
    elapsed += dt;
    // Kapealla (pysty)näytöllä hidastetaan, jotta eteenpäin ehtii nähdä.
    const viewFactor = Math.max(0.6, Math.min(1, worldW / 1400));
    speed = Math.min(MAX_SPEED, START_SPEED + elapsed * 6) * viewFactor;
    gap = Math.max(MIN_GAP, START_GAP - elapsed * 7.5);
    score = Math.floor(elapsed * 10);

    vy += (pressing ? -THRUST : GRAVITY) * dt;
    vy = Math.max(-MAX_VY, Math.min(MAX_VY, vy));
    head.y += vy * dt;

    const dx = speed * dt;
    distance += dx;
    for (const s of cave) s.x -= dx;
    for (const b of blocks) b.x -= dx;
    for (const t of trail) t.x -= dx;
    for (const p of particles) p.x -= dx;

    while (cave.length && cave[1] && cave[1].x < -SEG_W) cave.shift();
    while (cave[cave.length - 1].x < worldW + SEG_W * 2) pushSegment(cave[cave.length - 1].x + SEG_W, false);
    blocks = blocks.filter(b => b.x + b.w > -10);

    trail.push({ x: head.x, y: head.y });
    while (trail.length && trail[0].x < head.x - BODY_LEN) trail.shift();

    // Savuvana hännästä
    if (Math.random() < 0.6) {
      particles.push({ x: head.x - 6, y: head.y, vx: -40, vy: (Math.random() - 0.5) * 30, life: 0.6, max: 0.6, r: 3 + Math.random() * 3, c: 'smoke' });
    }
    updateParticles(dt);

    // Törmäystarkistus
    const w = caveAt(head.x);
    let hit = head.y - HEAD_R < w.top || head.y + HEAD_R > w.bot || head.y < 0 || head.y > WORLD_H;
    if (!hit) {
      for (const b of blocks) {
        const cx = Math.max(b.x, Math.min(head.x, b.x + b.w));
        const cy = Math.max(b.y, Math.min(head.y, b.y + b.h));
        if ((cx - head.x) ** 2 + (cy - head.y) ** 2 < HEAD_R * HEAD_R) { hit = true; break; }
      }
    }
    if (hit) gameOver();
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.c === 'spark') p.vy += 900 * dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function draw() {
    const W = worldW;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // Tausta
    const bg = ctx.createLinearGradient(0, 0, 0, WORLD_H);
    bg.addColorStop(0, '#16202b'); bg.addColorStop(1, '#0d141c');
    ctx.fillStyle = bg;
    ctx.fillRect(-20, -20, W + 40, WORLD_H + 40);

    // Taustan parallaksipisteet
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    const off = (distance * 0.3) % 200;
    for (let x = -off; x < W + 200; x += 200) {
      for (let y = 60; y < WORLD_H; y += 170) {
        ctx.beginPath(); ctx.arc(x + ((y * 7) % 90), y, 3, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Seinät
    const hue = 25 + Math.min(elapsed, 120) * 1.5; // värisävy muuttuu ajan myötä
    const rock = ctx.createLinearGradient(0, 0, 0, WORLD_H);
    rock.addColorStop(0, `hsl(${hue}, 35%, 30%)`);
    rock.addColorStop(0.5, `hsl(${hue}, 40%, 20%)`);
    rock.addColorStop(1, `hsl(${hue}, 35%, 30%)`);
    ctx.fillStyle = rock;
    ctx.beginPath();
    ctx.moveTo(cave[0].x, -20);
    for (const s of cave) ctx.lineTo(s.x, s.top);
    ctx.lineTo(cave[cave.length - 1].x, -20);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cave[0].x, WORLD_H + 20);
    for (const s of cave) ctx.lineTo(s.x, s.bot);
    ctx.lineTo(cave[cave.length - 1].x, WORLD_H + 20);
    ctx.closePath(); ctx.fill();

    // Seinien reunaviiva
    ctx.strokeStyle = `hsl(${hue}, 60%, 55%)`;
    ctx.lineWidth = 4; ctx.lineJoin = 'round';
    ctx.beginPath(); cave.forEach((s, i) => i ? ctx.lineTo(s.x, s.top) : ctx.moveTo(s.x, s.top)); ctx.stroke();
    ctx.beginPath(); cave.forEach((s, i) => i ? ctx.lineTo(s.x, s.bot) : ctx.moveTo(s.x, s.bot)); ctx.stroke();

    // Esteet
    for (const b of blocks) {
      ctx.fillStyle = `hsl(${hue}, 40%, 26%)`;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = `hsl(${hue}, 60%, 55%)`;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    }

    // Hiukkaset
    for (const p of particles) {
      const a = p.life / p.max;
      ctx.fillStyle = p.c === 'spark' ? `rgba(255, ${150 + 100 * a | 0}, 80, ${a})` : `rgba(180, 220, 170, ${a * 0.25})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p.c === 'smoke' ? 2 - a : 1), 0, Math.PI * 2); ctx.fill();
    }

    drawWorm();
  }

  function drawWorm() {
    if (state === 'over' && head.dead) return;
    // Vartalo: ympyröitä pään historiaa pitkin, ohenee häntää kohti.
    const n = 22;
    for (let i = n; i >= 0; i--) {
      const x = head.x - (BODY_LEN * i) / n;
      const y = trailY(x);
      const t = 1 - i / n;
      const r = HEAD_R * (0.45 + 0.55 * t);
      ctx.fillStyle = i % 2 ? '#5fc24f' : '#7ee36b';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    // Pää
    ctx.fillStyle = '#9af08a';
    ctx.beginPath(); ctx.arc(head.x, head.y, HEAD_R + 2, 0, Math.PI * 2); ctx.fill();
    // Silmä
    const look = Math.max(-1, Math.min(1, vy / MAX_VY));
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(head.x + 5, head.y - 4, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(head.x + 7, head.y - 4 + look * 2.5, 2.8, 0, Math.PI * 2); ctx.fill();
  }

  function trailY(x) {
    if (!trail.length) return head.y;
    if (x <= trail[0].x) return trail[0].y;
    for (let i = trail.length - 1; i > 0; i--) {
      const a = trail[i - 1], b = trail[i];
      if (x >= a.x) {
        const t = b.x === a.x ? 0 : (x - a.x) / (b.x - a.x);
        return a.y + (b.y - a.y) * t;
      }
    }
    return head.y;
  }

  function loop(t) {
    const dt = Math.min(0.033, (t - lastTime) / 1000 || 0);
    lastTime = t;
    if (state === 'playing') {
      update(dt);
      scoreEl.textContent = score;
    } else {
      updateParticles(dt);
      shake = Math.max(0, shake - 60 * dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Tilat ja käyttöliittymä ----------
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best'), hud = $('hud');
  const menu = $('menu'), over = $('over'), scoresView = $('scores');
  const nameForm = $('nameForm'), nameInput = $('nameInput'), overButtons = $('overButtons');
  let pendingScore = 0, highlightIndex = -1;

  function show(el) { [menu, over, scoresView].forEach(o => o.classList.toggle('hidden', o !== el)); }

  function startGame() {
    resetWorld();
    pressing = false;
    state = 'playing';
    show(null);
    hud.hidden = false;
    bestEl.textContent = 'Ennätys ' + bestScore();
  }

  function gameOver() {
    state = 'over';
    pressing = false;
    head.dead = true;
    shake = 18;
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2, v = 100 + Math.random() * 350;
      particles.push({ x: head.x, y: head.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.9, max: 0.9, r: 3 + Math.random() * 3, c: 'spark' });
    }
    if (navigator.vibrate) navigator.vibrate(150);
    pendingScore = score;
    $('finalScore').textContent = score;
    const isTop = qualifies(score);
    nameForm.hidden = !isTop;
    overButtons.hidden = isTop;
    // Pieni viive, ettei sormen nosto heti paina nappia.
    setTimeout(() => {
      show(over);
      if (isTop) {
        try { nameInput.value = localStorage.getItem(LAST_NAME_KEY) || ''; } catch {}
        nameInput.focus();
        nameInput.select();
      }
    }, 600);
  }

  function saveName() {
    const name = (nameInput.value.trim() || 'Nimetön').slice(0, 16);
    try { localStorage.setItem(LAST_NAME_KEY, name); } catch {}
    highlightIndex = addScore(name, pendingScore);
    nameInput.blur();
    showScores();
  }

  function showScores() {
    const list = loadScores();
    const ol = $('scoreList');
    ol.innerHTML = '';
    if (!list.length) {
      const li = document.createElement('div');
      li.className = 'empty';
      li.textContent = 'Ei vielä tuloksia.';
      ol.appendChild(li);
    }
    list.forEach((e, i) => {
      const li = document.createElement('li');
      if (i === highlightIndex) li.className = 'me';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = e.name;
      const s = document.createElement('span'); s.className = 's'; s.textContent = e.score;
      li.append(n, s);
      ol.appendChild(li);
    });
    highlightIndex = -1;
    show(scoresView);
  }

  function backToMenu() { state = 'menu'; hud.hidden = true; resetWorld(); show(menu); }

  $('startBtn').addEventListener('click', startGame);
  $('scoresBtn').addEventListener('click', showScores);
  $('againBtn').addEventListener('click', startGame);
  $('overScoresBtn').addEventListener('click', showScores);
  $('scoresPlayBtn').addEventListener('click', startGame);
  $('scoresBackBtn').addEventListener('click', backToMenu);
  $('saveBtn').addEventListener('click', saveName);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); e.stopPropagation(); });

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
