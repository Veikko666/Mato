<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Glowworm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
  /* Dark bioluminescent cave: one deliberate dark look, glow accents only. */
  :root {
    --bg: #04090f;
    --panel: rgba(6, 18, 26, 0.78);
    --line: rgba(140, 255, 200, 0.16);
    --text: #e4fbf6;
    --muted: #87aab0;
    --glow: #a6ff7e;
    --glow-deep: #3fbf4a;
    --ink: #08200a;
    --font: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
    pointer-events: none; z-index: 5;
  }
  #score {
    font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--text); text-shadow: 0 0 12px rgba(166, 255, 126, .55);
  }
  #score.bump { animation: bump .45s ease-out; }
  .hud-left { display: flex; align-items: center; gap: 10px; }
  #combo {
    position: relative; overflow: hidden; padding: 3px 10px 5px; border-radius: 999px;
    font-size: 18px; font-weight: 700; color: var(--ink); background: var(--glow);
    box-shadow: 0 0 16px rgba(166,255,126,.6); font-variant-numeric: tabular-nums;
  }
  #combo i {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(8,32,10,.55);
    transform-origin: left center;
  }
  #combo.pop { animation: bump .35s ease-out; }
  .stats { font-size: 15px; font-variant-numeric: tabular-nums; }
  button.gold {
    background: linear-gradient(180deg, #ffe08a, #e0a43a); color: #2a1a02;
    box-shadow: 0 0 22px rgba(255, 210, 110, .35);
  }
  button .sub { display: block; font-size: 13px; font-weight: 400; opacity: .8; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
  button.chip {
    width: auto; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 999px;
    background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--line); box-shadow: none;
  }
  button.chip.active { background: var(--glow); color: var(--ink); border-color: transparent; }
  .mode-label { margin: 0 0 4px; font-size: 14px; letter-spacing: .6px; text-transform: uppercase; }
  @keyframes bump { 0% { transform: scale(1.35); color: var(--glow); } 100% { transform: scale(1); } }
  .hud-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  #best { color: var(--muted); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
  .icon-btn {
    pointer-events: auto; width: 42px; height: 42px; margin: 0; padding: 9px;
    border-radius: 50%; background: rgba(255,255,255,.07); border: 1px solid var(--line);
    color: var(--text); cursor: pointer;
  }
  .icon-btn svg { width: 100%; height: 100%; display: block; }
  .icon-btn.muted .waves { display: none; }
  .icon-btn:not(.muted) .cross { display: none; }
  .icon-btn.muted { color: var(--muted); }

  .overlay {
    position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
    background: radial-gradient(ellipse at center, rgba(2,6,10,.15), rgba(2,6,10,.6));
  }
  .overlay.hidden { display: none; }
  .panel {
    width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
    padding: 24px 22px; text-align: center;
    box-shadow: 0 0 60px rgba(80, 255, 160, .08), 0 20px 50px rgba(0,0,0,.55);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    animation: rise .35s ease-out;
  }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  .logo {
    margin: 0; font-size: 46px; font-weight: 700; letter-spacing: 1px; line-height: 1.05;
    color: var(--glow); text-wrap: balance;
    text-shadow: 0 0 6px rgba(166,255,126,.9), 0 0 24px rgba(166,255,126,.55), 0 0 60px rgba(63,191,74,.5);
    animation: pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { text-shadow: 0 0 4px rgba(166,255,126,.7), 0 0 14px rgba(166,255,126,.35), 0 0 36px rgba(63,191,74,.3); } }
  h2 { margin: 0 0 6px; font-size: 26px; font-weight: 600; text-wrap: balance; }
  p { margin: 8px 0; color: var(--muted); line-height: 1.45; }
  .tagline { color: var(--text); font-size: 18px; margin-top: 12px; }
  .tribute { font-size: 13px; margin-top: 16px; letter-spacing: .4px; opacity: .8; }
  .score-big {
    font-size: 56px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums;
    color: var(--text); text-shadow: 0 0 20px rgba(166,255,126,.45);
  }
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: 14px;
    letter-spacing: .5px; text-transform: uppercase; color: var(--ink); background: var(--glow);
    box-shadow: 0 0 18px rgba(166,255,126,.6);
  }
  .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  button {
    font: inherit; font-weight: 600; font-size: 19px; cursor: pointer; margin: 0;
    border: 0; border-radius: 14px; padding: 14px 18px; width: 100%;
    background: linear-gradient(180deg, var(--glow), var(--glow-deep)); color: var(--ink);
    box-shadow: 0 0 22px rgba(166,255,126,.35); touch-action: manipulation;
  }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  button.secondary { background: rgba(255,255,255,.08); color: var(--text); box-shadow: none; border: 1px solid var(--line); }
  button.link { background: none; box-shadow: none; color: var(--muted); font-size: 15px; padding: 6px; text-decoration: underline; }
  input {
    font: inherit; font-size: 19px; width: 100%; padding: 12px; margin-top: 4px;
    border-radius: 12px; border: 1px solid var(--line);
    background: rgba(0,0,0,.45); color: var(--text); text-align: center;
    -webkit-user-select: text; user-select: text;
  }
  input:focus { outline: 2px solid var(--glow); }
  ol { list-style: none; padding: 0; margin: 14px 0 0; text-align: left; counter-reset: rank; }
  ol li {
    counter-increment: rank; display: flex; gap: 10px; padding: 8px 12px; border-radius: 10px; font-size: 17px;
  }
  ol li:nth-child(odd) { background: rgba(255,255,255,.04); }
  ol li::before { content: counter(rank) "."; width: 28px; color: var(--muted); font-variant-numeric: tabular-nums; }
  ol li .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol li .s { font-weight: 600; font-variant-numeric: tabular-nums; }
  ol li.me { background: rgba(166,255,126,.16); color: var(--glow); }
  .empty { color: var(--muted); text-align: center; padding: 12px; }
  @media (max-height: 560px) {
    .panel { padding: 16px 18px; }
    .logo { font-size: 34px; }
    .tagline { font-size: 16px; margin-top: 6px; }
    #menu .panel > p:not(.tagline) { display: none; }
    .stack { gap: 8px; margin-top: 10px; }
    button { padding: 10px 14px; font-size: 17px; }
    .chips { margin-top: 10px; }
    .score-big { font-size: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo, .panel, #score.bump { animation: none; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-left">
    <span id="score" hidden>0</span>
    <span id="combo" hidden>×2<i></i></span>
  </div>
  <div class="hud-right">
    <span id="best"></span>
    <button class="icon-btn" id="musicBtn" type="button" aria-label="Music">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l11-2v13"/>
        <circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/>
        <g class="cross"><path d="M3 3l18 18" stroke-width="2.4"/></g>
      </svg>
    </button>
    <button class="icon-btn" id="muteBtn" type="button" aria-label="Sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
        <g class="waves"><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></g>
        <g class="cross"><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></g>
      </svg>
    </button>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1 class="logo" data-t="title">Glowworm</h1>
    <p class="tagline" data-t="tagline"></p>
    <p data-t="hint"></p>
    <div class="stack">
      <button id="startBtn" type="button"><span data-t="endless"></span><span class="sub" data-t="endlessSub"></span></button>
      <button class="gold" id="dailyBtn" type="button"><span data-t="daily"></span><span class="sub" id="dailyDate"></span></button>
      <button class="secondary" id="scoresBtn" type="button" data-t="top10"></button>
    </div>
    <div class="chips">
      <button class="chip" id="ghostBtn" type="button"></button>
      <button class="chip" id="styleBtn" type="button"></button>
    </div>
    <div class="stack"><button class="link" id="langBtn" type="button" data-t="lang"></button></div>
    <p class="tribute" data-t="tribute"></p>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="panel">
    <p class="mode-label" id="overMode"></p>
    <h2 data-t="crashed"></h2>
    <div class="score-big" id="finalScore">0</div>
    <span class="badge" id="newBest" hidden data-t="newBest"></span>
    <p class="stats" id="stats"></p>
    <div id="nameForm" hidden>
      <p data-t="newTop"></p>
      <input id="nameInput" maxlength="16" autocomplete="off" data-tp="namePh">
      <div class="stack"><button id="saveBtn" type="button" data-t="save"></button></div>
    </div>
    <div class="stack" id="overButtons">
      <button id="againBtn" type="button" data-t="again"></button>
      <button class="secondary" id="overScoresBtn" type="button" data-t="top10"></button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="scores">
  <div class="panel">
    <h2 data-t="top10"></h2>
    <div class="chips">
      <button class="chip" id="tabEndless" type="button" data-t="endless"></button>
      <button class="chip" id="tabDaily" type="button" data-t="daily"></button>
    </div>
    <ol id="scoreList"></ol>
    <div class="stack">
      <button id="scoresPlayBtn" type="button" data-t="play"></button>
      <button class="secondary" id="scoresBackBtn" type="button" data-t="back"></button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="pause">
  <div class="panel">
    <h2 data-t="paused"></h2>
    <p data-t="resume"></p>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  // ---------- Storage ----------
  const STORE_KEY = 'mato-luola-top10';
  const LAST_NAME_KEY = 'mato-luola-nimi';
  const LANG_KEY = 'glowworm-lang';
  const MUTE_KEY = 'glowworm-muted';
  const MUSIC_KEY = 'glowworm-music';
  const STYLE_KEY = 'glowworm-music-style';
  const GHOST_KEY = 'glowworm-ghost';

  function getItem(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function setItem(k, v) { try { localStorage.setItem(k, v); } catch {} }

  // Two modes: 'endless' (a new cave every run) and 'daily' (one seeded cave per calendar day)
  let mode = 'endless';
  const todayKey = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  let day = todayKey();
  const listKey = m => m === 'daily' ? `glowworm-daily-top10-${day}` : STORE_KEY;
  const distKey = m => m === 'daily' ? `glowworm-daily-dist-${day}` : 'glowworm-best-dist';
  const ghostKey = () => `glowworm-daily-ghost-${day}`;

  function pruneOldDays() {
    try {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const k = localStorage.key(i);
        if (k && k.startsWith('glowworm-daily-') && !k.endsWith(day)) localStorage.removeItem(k);
      }
    } catch {}
  }

  function loadScores(m = mode) {
    try {
      const list = JSON.parse(getItem(listKey(m)) || '[]');
      return Array.isArray(list) ? list.filter(e => e && typeof e.score === 'number').slice(0, 10) : [];
    } catch { return []; }
  }
  function qualifies(score, m = mode) {
    const list = loadScores(m);
    return score > 0 && (list.length < 10 || score > list[list.length - 1].score);
  }
  function addScore(name, score, m = mode) {
    const list = loadScores(m);
    const entry = { name, score, date: Date.now() };
    list.push(entry);
    list.sort((a, b) => b.score - a.score || a.date - b.date);
    const top = list.slice(0, 10);
    setItem(listKey(m), JSON.stringify(top));
    return top.indexOf(entry);
  }
  function bestScore(m = mode) {
    const list = loadScores(m);
    return list.length ? list[0].score : 0;
  }

  // ---------- Language ----------
  const STRINGS = {
    en: {
      title: 'Glowworm',
      tagline: 'Hold to rise. Let go to fall.',
      hint: 'The cave keeps closing in. Grab light orbs and skim the walls to build your multiplier.',
      endless: 'Endless', endlessSub: 'A new cave every run', daily: 'Daily cave',
      ghost: 'Ghost', on: 'On', off: 'Off', calm: 'Calm', rising: 'Rising',
      close: 'Close!', orbs: 'Orbs', closeCalls: 'Close calls', maxCombo: 'Best multiplier', furthest: 'Your furthest',
      play: 'Play', top10: 'Top 10', back: 'Back', again: 'Play again', save: 'Save',
      crashed: 'Crashed!', newBest: 'New best!',
      newTop: 'You made the top 10! Enter your name:', namePh: 'Your name', anon: 'Anonymous',
      empty: 'No scores yet. Be the first.',
      best: 'Best', paused: 'Paused', resume: 'Tap to continue',
      lang: 'Suomeksi', tribute: 'A tribute to SFCave', sound: 'Sound', music: 'Music',
    },
    fi: {
      title: 'Kiiltomato',
      tagline: 'Pidä pohjassa, niin mato nousee. Päästä irti, niin se laskee.',
      hint: 'Luola kapenee koko ajan. Kerää valopalloja ja liu\'u läheltä seiniä, niin kerroin kasvaa.',
      endless: 'Loputon', endlessSub: 'Uusi luola joka kerta', daily: 'Päivän luola',
      ghost: 'Haamu', on: 'Päällä', off: 'Pois', calm: 'Rauhallinen', rising: 'Kiihtyvä',
      close: 'Läheltä piti!', orbs: 'Valopallot', closeCalls: 'Läheltä piti', maxCombo: 'Paras kerroin', furthest: 'Pisin matkasi',
      play: 'Pelaa', top10: 'Top 10', back: 'Takaisin', again: 'Uudestaan', save: 'Tallenna',
      crashed: 'Törmäsit!', newBest: 'Uusi ennätys!',
      newTop: 'Pääsit top 10 -listalle! Kirjoita nimesi:', namePh: 'Nimesi', anon: 'Nimetön',
      empty: 'Ei vielä tuloksia. Ole ensimmäinen.',
      best: 'Ennätys', paused: 'Tauko', resume: 'Napauta jatkaaksesi',
      lang: 'In English', tribute: 'Kunnianosoitus SFCave-pelille', sound: 'Äänet', music: 'Musiikki',
    },
  };
  let lang = getItem(LANG_KEY) === 'fi' ? 'fi' : 'en';
  const t = key => STRINGS[lang][key];

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = t(el.dataset.tp); });
    $('muteBtn').setAttribute('aria-label', t('sound'));
    $('musicBtn').setAttribute('aria-label', t('music'));
    $('dailyDate').textContent = new Date().toLocaleDateString(lang === 'fi' ? 'fi-FI' : 'en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    syncChips();
    updateBest();
  }

  // ---------- Sound (Web Audio, all synthesized) ----------
  const Sound = (() => {
    let ac = null, master, ambGain, thrustGain, thrustFilter, echo, noiseBuf;
    let muted = getItem(MUTE_KEY) === '1';

    // ----- Generative ambient music -----
    // A slow four-chord loop (Am9, Fmaj9, Cmaj7, G6/9) as MIDI notes.
    const CHORDS = [
      { bass: 45, pad: [60, 64, 67, 71] },
      { bass: 41, pad: [57, 64, 67, 72] },
      { bass: 48, pad: [55, 59, 64, 67] },
      { bass: 43, pad: [59, 62, 64, 69] },
    ];
    const CHORD_LEN = 9;       // seconds per chord
    const STEP = 0.375;        // pluck grid
    const MUSIC_VOL = 0.55;
    let musicBus, musicIn, pluckIn;
    let musicOn = getItem(MUSIC_KEY) !== '0';
    let busy = false;          // more plucks while playing
    let style = getItem(STYLE_KEY) === 'rising' ? 'rising' : 'calm';
    let intensity = 0;         // 0..1, only used by the 'rising' style
    let nextChordAt = 0, nextStepAt = 0, chordIdx = 0, stepIdx = 0;
    const chordLog = [];       // [{t, idx}] so plucks follow the chord sounding at their time
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

    function chordAt(time) {
      for (let i = chordLog.length - 1; i >= 0; i--) if (chordLog[i].t <= time) return CHORDS[chordLog[i].idx];
      return CHORDS[0];
    }

    function playChord(ch, at, len) {
      const end = at + len;
      const attack = Math.min(2.8, len * 0.3);
      const f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.Q.value = 0.7;
      f.frequency.setValueAtTime(450, at);
      f.frequency.linearRampToValueAtTime(1300, at + len * 0.55);
      f.frequency.linearRampToValueAtTime(500, end + 3);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(0.03, at + attack);
      g.gain.setValueAtTime(0.03, end);
      g.gain.linearRampToValueAtTime(0.0001, end + 3.5);
      f.connect(g); g.connect(musicIn);
      for (const m of ch.pad) {
        for (const det of [-8, 8]) {
          const o = ac.createOscillator();
          o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det + (Math.random() - 0.5) * 4;
          o.connect(f); o.start(at); o.stop(end + 4);
        }
      }
      // A faint glassy shimmer two octaves above the root
      const sh = ac.createOscillator(), shG = ac.createGain();
      sh.type = 'sine'; sh.frequency.value = mtof(ch.pad[0] + 24);
      shG.gain.setValueAtTime(0.0001, at + 1);
      shG.gain.linearRampToValueAtTime(0.012, at + 4);
      shG.gain.linearRampToValueAtTime(0.0001, end + 2);
      sh.connect(shG); shG.connect(musicIn); sh.start(at + 1); sh.stop(end + 2.5);
      // Soft sub bass
      const b = ac.createOscillator(), bG = ac.createGain();
      b.type = 'sine'; b.frequency.value = mtof(ch.bass);
      bG.gain.setValueAtTime(0.0001, at);
      bG.gain.linearRampToValueAtTime(0.11, at + 1.5);
      bG.gain.setValueAtTime(0.11, end - 0.5);
      bG.gain.linearRampToValueAtTime(0.0001, end + 1.5);
      b.connect(bG); bG.connect(musicBus); b.start(at); b.stop(end + 2);
    }

    function pluck(at) {
      const ch = chordAt(at);
      const m = ch.pad[(Math.random() * ch.pad.length) | 0] + (Math.random() < 0.25 ? 24 : 12);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.045, at + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 1.4);
      g.connect(pluckIn);
      const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m);
      const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = mtof(m + 19);
      const g2 = ac.createGain(); g2.gain.value = 0.25;
      o.connect(g); o2.connect(g2); g2.connect(g);
      o.start(at); o2.start(at); o.stop(at + 1.5); o2.stop(at + 1.5);
    }

    function kick(at, I) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(120, at);
      o.frequency.exponentialRampToValueAtTime(42, at + 0.22);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.12 + 0.2 * I, at + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.32);

    function hat(at, I) {
      const src = ac.createBufferSource(); src.buffer = noiseBuf;
      const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.02 + 0.03 * I, at + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.06);
      src.connect(f); f.connect(g); g.connect(musicBus);
      src.start(at, Math.random()); src.stop(at + 0.08);
    }

    function arp(at, I, k) {
      // Rising chord-tone arpeggio, brighter as intensity grows
      const ch = chordAt(at);
      const notes = ch.pad.concat(ch.pad.map(m => m + 12));
      const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'square'; o.frequency.value = mtof(notes[k % notes.length] + 12);
      f.type = 'lowpass'; f.frequency.value = 900 + 1800 * I;

      g.gain.exponentialRampToValueAtTime(0.012 + 0.014 * I, at + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.2);

    let arpIdx = 0;
    function musicTick() {
      if (!ac || ac.state !== 'running' || !musicOn) return;
      const now = ac.currentTime;
      const I = style === 'rising' ? intensity : 0;
      if (nextChordAt < now) nextChordAt = now + 0.1;
      if (nextStepAt < now) nextStepAt = now + 0.1;
      while (nextChordAt < now + 1) {
        const len = CHORD_LEN * (1 - 0.45 * I);
        chordLog.push({ t: nextChordAt, idx: chordIdx });
        if (chordLog.length > 4) chordLog.shift();
        playChord(CHORDS[chordIdx], nextChordAt, len);
        chordIdx = (chordIdx + 1) % CHORDS.length;
        nextChordAt += len;
      }
      while (nextStepAt < now + 1) {
        // 16th-note grid. Calm: plucks on 8ths, favouring the beat; sparse in the menu, livelier in game.
        // Rising: a kick, then hats and an arpeggio fade in, and the tempo creeps up.
        const at = nextStepAt;

          if (Math.random() < p) pluck(at);

        if (I > 0.12 && stepIdx % 4 === 0) kick(at, I);
        if (I > 0.55 && stepIdx % 4 === 2) hat(at, I);
        if (I > 0.3 && (stepIdx % 2 === 0 || I > 0.7)) arp(at, I, arpIdx++);

    function init() {
      if (ac) { if (ac.state === 'suspended' && !document.hidden) ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.9;
      master.connect(ac.destination);

      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);

      echo = ac.createDelay(1);
      echo.delayTime.value = 0.23;
      const fb = ac.createGain(); fb.gain.value = 0.38;
      const echoLp = ac.createBiquadFilter(); echoLp.type = 'lowpass'; echoLp.frequency.value = 2200;
      echo.connect(echoLp); echoLp.connect(fb); fb.connect(echo); echoLp.connect(master);

      ambGain.connect(master);
      const air = ac.createBufferSource(); air.buffer = noiseBuf; air.loop = true;
      const airBp = ac.createBiquadFilter(); airBp.type = 'bandpass'; airBp.frequency.value = 450; airBp.Q.value = 0.6;
      const airG = ac.createGain(); airG.gain.value = 0.06;

      musicBus.connect(master);
      musicIn = ac.createGain();
      musicIn.connect(musicBus);

      const len = ac.sampleRate * 4;
      const ir = ac.createBuffer(2, len, ac.sampleRate);

        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      }
      verb.buffer = ir;
      const verbG = ac.createGain(); verbG.gain.value = 0.7;
      musicIn.connect(verb); verb.connect(verbG); verbG.connect(musicBus);
      pluckIn = ac.createGain();
      const pDelay = ac.createDelay(2); pDelay.delayTime.value = 0.56;
      const pFb = ac.createGain(); pFb.gain.value = 0.42;
      const pLp = ac.createBiquadFilter(); pLp.type = 'lowpass'; pLp.frequency.value = 1800;
      pluckIn.connect(musicIn); pluckIn.connect(pDelay);
      pDelay.connect(pLp); pLp.connect(pFb); pFb.connect(pDelay); pLp.connect(musicIn);
      setInterval(musicTick, 250);

      // Thrust: filtered noise "whoosh", gain follows the finger
      const th = ac.createBufferSource(); th.buffer = noiseBuf; th.loop = true;
      thrustFilter = ac.createBiquadFilter(); thrustFilter.type = 'bandpass'; thrustFilter.frequency.value = 600; thrustFilter.Q.value = 1.4;
      thrustGain = ac.createGain(); thrustGain.gain.value = 0;
      th.connect(thrustFilter); thrustFilter.connect(thrustGain); thrustGain.connect(master); th.start();
    }

    function tone(freq, at, dur, { type = 'sine', vol = 0.15, slideTo = 0, send = 0.4 } = {}) {
      if (!ac) return;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, at);

      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(vol, at + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(g); g.connect(master);

    return {
      init,
      get muted() { return muted; },
      setMuted(m) {
        muted = m;
        setItem(MUTE_KEY, m ? '1' : '0');
        if (ac) master.gain.setTargetAtTime(m ? 0 : 0.9, ac.currentTime, 0.05);
      },
      get musicOn() { return musicOn; },
      get style() { return style; },
      setStyle(st) { style = st; setItem(STYLE_KEY, st); },
      intensity(x) { intensity = Math.max(0, Math.min(1, x)); },
      setMusic(on) {
        musicOn = on;
        setItem(MUSIC_KEY, on ? '1' : '0');
        if (ac) musicBus.gain.setTargetAtTime(on ? MUSIC_VOL : 0, ac.currentTime, 0.4);
      },
      mood(level, playing) {
        busy = !!playing;
        if (ac) ambGain.gain.setTargetAtTime(level, ac.currentTime, 0.8);
      },
      thrust(on, vy) {
        if (!ac) return;
        const now = ac.currentTime;
        thrustGain.gain.setTargetAtTime(on ? 0.07 : 0, now, on ? 0.03 : 0.09);
        thrustFilter.frequency.setTargetAtTime(Math.max(300, Math.min(1500, 650 - vy * 0.9)), now, 0.06);
      },
      click() { if (ac) tone(720, ac.currentTime, 0.07, { type: 'triangle', vol: 0.08, send: 0.15 }); },
      chime() {
        if (!ac) return;

        tone(1480, n + 0.09, 0.7, { vol: 0.1 });
      },
      orb(level) {
        if (!ac) return;

        const m = 76 + scale[Math.min(level, scale.length - 1)];
        tone(mtof(m), ac.currentTime, 0.35, { type: 'triangle', vol: 0.11, send: 0.35 });

      comboLost() { if (ac) tone(520, ac.currentTime, 0.35, { type: 'triangle', vol: 0.06, slideTo: 260, send: 0.2 }); },
      fanfare() {

        const f = ac.createBiquadFilter(); f.type = 'lowpass';
        f.frequency.setValueAtTime(2600, n); f.frequency.exponentialRampToValueAtTime(90, n + 0.7);

  })();

  // ---------- Canvas ----------
  const canvas = $('game');
  const ctx = canvas.getContext('2d');
  const WORLD_H = 1000;        // the world is always 1000 units tall; width follows the screen
  let worldW = 1600, scale = 1;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    scale = canvas.height / WORLD_H;
    worldW = canvas.width / scale;
    if (state !== 'playing' && state !== 'paused') resetWorld();
    seedMotes();
  }

  // Cached glow sprites, one per 10° of hue
  const glowCache = new Map();
  function glowSprite(h) {
    h = ((Math.round(h / 10) * 10) % 360 + 360) % 360;
    let c = glowCache.get(h);
    if (!c) {
      c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d');
      const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, `hsla(${h},100%,88%,1)`);
      gr.addColorStop(0.22, `hsla(${h},100%,66%,0.55)`);
      gr.addColorStop(1, `hsla(${h},100%,50%,0)`);
      g.fillStyle = gr;
      g.fillRect(0, 0, 64, 64);
      glowCache.set(h, c);
    }
    return c;
  }
  function glow(h, x, y, r, a) {
    ctx.globalAlpha = a;
    ctx.drawImage(glowSprite(h), x - r, y - r, r * 2, r * 2);
  }

  // ---------- Game parameters ----------
  const SEG_W = 20;
  const HEAD_R = 14;
  const BODY_LEN = 240;
  const TRAIL_LEN = 900;       // the light trail behind the worm, a nod to SFCave
  const GRAVITY = 1500;
  const THRUST = 1500;
  const MAX_VY = 600;
  const START_GAP = 620;
  const MIN_GAP = 150;
  const START_SPEED = 380;
  const MAX_SPEED = 720;
  const WORM_HUE = 100;
  // Zone hues drift as you go deeper: teal, violet, magenta, amber, green, back to teal
  const ZONE_HUES = [190, 262, 318, 385, 470, 550];
  const ZONE_SECS = 30;

  let state = 'menu';          // menu | playing | paused | over
  let pressing = false;
  let cave = [], blocks = [], trail = [], particles = [], rings = [], motes = [];
  let head, vy, distance, elapsed, speed, center, centerVel, nextBlockAt;
  let score = 0, lastTime = 0, shake = 0, flash = 0, hue = ZONE_HUES[0];
  // Scoring: time points and bonuses are all scaled by the multiplier
  const COMBO_TIME = 4;        // seconds before an idle combo runs out
  const NEAR_DIST = 16;        // clearance that counts as a close call
  let orbs = [], popups = [], orbQueue = null, nextOrbAt = 0;
  let points = 0, combo = 0, comboTimer = 0, nearArmed = true, nearCooldown = 0;
  let stats = { orbs: 0, close: 0, maxMult: 1 };
  let runBest = 0, passedBest = false, passedFar = false;
  let bestDist = 0;
  const mult = () => Math.min(5, 1 + Math.floor(combo / 4));

  const headX = () => Math.min(worldW * 0.25, 420);

  // Seeded RNG for everything that shapes the cave, so a seed always builds the same cave.
  function mulberry32(a) {
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashString(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  let rng = Math.random;

  // Difficulty follows how far into the cave a segment is, never the clock or the screen size,
  // so the daily cave is identical on every device. genTime(d) is the time a nominal-speed worm
  // needs to reach d; the old time-based tuning reads from it.
  const CALM_D = 600;          // a straight, quiet start
  const GEN_V0 = 300, GEN_ACC = 5, GEN_VMAX = 580;
  const GEN_CAP_T = (GEN_VMAX - GEN_V0) / GEN_ACC;
  const GEN_CAP_D = GEN_V0 * GEN_CAP_T + GEN_ACC / 2 * GEN_CAP_T * GEN_CAP_T;
  function genTime(d) {
    if (d <= 0) return 0;
    if (d < GEN_CAP_D) return (-GEN_V0 + Math.sqrt(GEN_V0 * GEN_V0 + 2 * GEN_ACC * d)) / GEN_ACC;
    return GEN_CAP_T + (d - GEN_CAP_D) / GEN_VMAX;
  }

  // Ghost: your best daily run, sampled every GHOST_STEP units of distance
  const GHOST_STEP = 10;
  let ghostOn = getItem(GHOST_KEY) !== '0';
  let ghost = null, ghostRec = [];
  function ghostY(d) {
    if (!ghost) return null;
    const i = d / GHOST_STEP;
    if (i < 0 || i > ghost.ys.length - 1) return null;
    const a = ghost.ys[Math.floor(i)], b = ghost.ys[Math.min(ghost.ys.length - 1, Math.floor(i) + 1)];
    return a + (b - a) * (i - Math.floor(i));
  }

  function resetWorld(seed) {
    rng = mulberry32(seed === undefined ? (Math.random() * 4294967296) >>> 0 : seed);
    cave = []; blocks = []; trail = []; particles = []; rings = []; ghostRec = [];
    distance = 0; elapsed = 0; speed = START_SPEED;
    center = WORLD_H / 2; centerVel = 0; nextBlockAt = 2500;
    vy = 0; score = 0; shake = 0; flash = 0; hue = ZONE_HUES[0];
    orbs = []; popups = []; orbQueue = null; nextOrbAt = 700;
    points = 0; combo = 0; comboTimer = 0; nearArmed = true; nearCooldown = 0;
    stats = { orbs: 0, close: 0, maxMult: 1 };
    runBest = bestScore(); passedBest = false; passedFar = false;
    bestDist = Number(getItem(distKey(mode))) || 0;
    head = { x: headX(), y: WORLD_H / 2, dead: false };
    // Segments sit on a grid aligned with the worm, so cave distances are the same on every screen.
    for (let x = head.x - Math.ceil(head.x / SEG_W) * SEG_W; x <= worldW + SEG_W * 2; x += SEG_W) pushSegment(x);
    for (let x = head.x - TRAIL_LEN; x <= head.x; x += 6) trail.push({ x, y: head.y });
  }

  function seedMotes() {
    motes = [];
    const n = Math.round(worldW / 30);
    for (let i = 0; i < n; i++) {
      motes.push({ x: Math.random() * worldW, y: Math.random() * WORLD_H, z: 0.15 + Math.random() * 0.6, ph: Math.random() * 6.28, r: 1 + Math.random() * 2 });
    }
  }

  function crystal(R) {
    return { d: 14 + R() * 26, n: 2 + (R() * 2 | 0), len: 0.7 + R() * 0.5, tilt: (R() - 0.5) * 0.6, h: (R() - 0.5) * 40 };
  }

  function pushSegment(x) {
    const d = Math.round(distance + x - head.x);   // how far into the cave this segment is
    const demo = state === 'menu';
    const calm = d < CALM_D;
    const R = calm ? Math.random : rng;
    const gt = demo ? 0 : genTime(d);
    const g = Math.max(MIN_GAP, START_GAP - gt * 7.5);
    if (!calm) {
      // The cave centre wanders randomly, more wildly the deeper you go.
      const wild = 0.6 + Math.min(gt / 60, 1.4);
      centerVel += (R() - 0.5) * 9 * wild;
      centerVel *= 0.94;
      const maxVel = 10 + 14 * Math.min(gt / 60, 1);
      centerVel = Math.max(-maxVel, Math.min(maxVel, centerVel));
      center += centerVel;
    }
    const margin = 30 + g / 2;
    if (center < margin) { center = margin; centerVel = Math.abs(centerVel); }
    if (center > WORLD_H - margin) { center = WORLD_H - margin; centerVel = -Math.abs(centerVel); }
    const jag = calm ? 0 : 6;
    cave.push({
      x,
      top: center - g / 2 + (R() - 0.5) * jag,
      bot: center + g / 2 + (R() - 0.5) * jag,
      r: R(),
      ct: R() < 0.09 ? crystal(R) : null,
      cb: R() < 0.09 ? crystal(R) : null,
    });
    if (calm) return;

    // Obstacles inside the cave once the game gets going.
    if (d > nextBlockAt && gt > 8) {
      const h = Math.min(60 + gt * 1.5, g * 0.38);
      const room = g - h - HEAD_R * 6;
      if (room > 0) {
        const y = center - g / 2 + HEAD_R * 3 + R() * room;
        blocks.push({ x, y, w: SEG_W * 1.6, h, seed: R() });
      }
      nextBlockAt = d + 900 + R() * 900 - Math.min(gt * 6, 500);
    }

    // Light orbs: some sit safely mid-cave, the valuable ones hug a wall.
    if (!demo && !orbQueue && d > nextOrbAt) {
      const r = R();
      const edge = r < 0.25 ? -1 : r < 0.5 ? 1 : 0;
      orbQueue = { left: R() < 0.35 ? 3 : 1, edge, frac: 0.3 + R() * 0.4, k: 0 };
    }
    if (orbQueue && orbQueue.k++ % 3 === 0) {
      const s = cave[cave.length - 1];
      const q = orbQueue;
      const y = q.edge < 0 ? s.top + 30 : q.edge > 0 ? s.bot - 30 : s.top + q.frac * (s.bot - s.top);
      const blocked = blocks.some(b => Math.abs(b.x + b.w / 2 - x) < 60 && y > b.y - 30 && y < b.y + b.h + 30);
      if (!blocked) orbs.push({ x, y, risky: q.edge !== 0, ph: Math.random() * 6.28 });
      if (--q.left <= 0) {
        orbQueue = null;
        nextOrbAt = d + 420 + R() * 600;
      }
    }
  }

  function caveAt(x) {
    for (let i = 0; i < cave.length - 1; i++) {
      const a = cave[i], b = cave[i + 1];
      if (x >= a.x && x <= b.x) {
        const f = (x - a.x) / (b.x - a.x);
        return { top: a.top + (b.top - a.top) * f, bot: a.bot + (b.bot - a.bot) * f };
      }
    }
    return { top: 0, bot: WORLD_H };
  }

  function zoneHue() {
    const z = elapsed / ZONE_SECS;
    const i = Math.floor(z) % (ZONE_HUES.length - 1);
    const f = Math.max(0, Math.min(1, (z - Math.floor(z) - 0.85) / 0.15));
    return (ZONE_HUES[i] + (ZONE_HUES[i + 1] - ZONE_HUES[i]) * f) % 360;
  }

  // ---------- Input ----------
  function press(e) {
    if (state !== 'playing') return;
    if (e) e.preventDefault();
    pressing = true;
  }
  function release() { pressing = false; }
  canvas.addEventListener('pointerdown', press);
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('blur', release);
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space' && e.code !== 'ArrowUp') return;
    if (state === 'playing') press(e);
    else if (state === 'paused') { e.preventDefault(); resumeGame(); }
    else if (state === 'menu' && !menu.classList.contains('hidden')) { e.preventDefault(); startGame('endless'); }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') release(); });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (state === 'playing') pauseGame();
      Sound.suspend();
    } else {
      Sound.resume();
    }
  });

  // ---------- Simulation ----------
  function autopilot() {
    // Attract mode in the menu: steer toward the cave centre a little ahead.
    const w = caveAt(head.x + 140);
    pressing = head.y + vy * 0.25 > (w.top + w.bot) / 2;
  }

  function update(dt) {
    const demo = state === 'menu';
    if (!demo) elapsed += dt;
    // On a narrow (portrait) screen slow down so there's time to see ahead.
    const viewFactor = Math.max(0.6, Math.min(1, worldW / 1400));
    speed = Math.min(MAX_SPEED, START_SPEED + elapsed * 6) * viewFactor * (demo ? 0.8 : 1);
    hue = zoneHue();
    if (demo) autopilot();

    if (!demo) {
      points += 10 * dt * mult();
      const prevScore = score;
      score = Math.floor(points);
      if (Math.floor(score / 250) > Math.floor(prevScore / 250)) milestone();
      if (!passedBest && runBest > 0 && score > runBest) {
        passedBest = true;
        popup(head.x + 60, head.y - 70, t('newBest'), 64, true);
        Sound.fanfare();
      }
      if (comboTimer > 0) {
        comboTimer -= dt;
        if (comboTimer <= 0) {
          if (mult() > 1) Sound.comboLost();
          combo = 0;
        }
      }
      nearCooldown -= dt;
    }

    vy += (pressing ? -THRUST : GRAVITY) * dt;
    vy = Math.max(-MAX_VY, Math.min(MAX_VY, vy));
    head.y += vy * dt;
    if (!demo) Sound.thrust(pressing, vy);

    const dx = speed * dt;
    distance += dx;
    for (const s of cave) s.x -= dx;
    for (const b of blocks) b.x -= dx;
    for (const p of trail) p.x -= dx;
    for (const p of particles) p.x -= dx;
    for (const r of rings) r.x -= dx;
    for (const o of orbs) o.x -= dx;
    for (const p of popups) p.x -= dx;

    while (cave.length > 2 && cave[1].x < -SEG_W) cave.shift();
    while (cave[cave.length - 1].x < worldW + SEG_W * 2) pushSegment(cave[cave.length - 1].x + SEG_W);
    blocks = blocks.filter(b => b.x + b.w > -40);
    orbs = orbs.filter(o => o.x > -40 && !o.taken);

    trail.push({ x: head.x, y: head.y });
    if (!demo && mode === 'daily') {
      while (ghostRec.length * GHOST_STEP <= distance) ghostRec.push(Math.round(head.y));
    }
    if (!demo) Sound.intensity(elapsed / 80);
    while (trail.length > 2 && trail[1].x < head.x - TRAIL_LEN) trail.shift();

    if (pressing && Math.random() < 0.7) {
      particles.push({ x: head.x - BODY_LEN, y: trailY(head.x - BODY_LEN) + (Math.random() - 0.5) * 8, vx: -30 - Math.random() * 40, vy: 40 + Math.random() * 60, life: 0.8, max: 0.8, r: 6 + Math.random() * 6, h: WORM_HUE });
    }

    const w = caveAt(head.x);
    let hit = head.y - HEAD_R < w.top || head.y + HEAD_R > w.bot || head.y < 0 || head.y > WORLD_H;
    if (!hit) {
      for (const b of blocks) {
        const cx = Math.max(b.x, Math.min(head.x, b.x + b.w));
        const cy = Math.max(b.y, Math.min(head.y, b.y + b.h));
        if ((cx - head.x) ** 2 + (cy - head.y) ** 2 < HEAD_R * HEAD_R) { hit = true; break; }
      }
    }
    if (hit) demo ? resetWorld() : gameOver();
    else if (!demo) { collectOrbs(); closeCalls(w); }
  }

  function award(base, x, y, label) {
    const m = mult();
    const gain = base * m;
    points += gain;
    combo++;
    comboTimer = COMBO_TIME;
    if (mult() > m) {
      Sound.levelUp(mult());
      rings.push({ x: head.x, y: head.y, r: HEAD_R, life: 0.6, max: 0.6 });
      comboEl.classList.remove('pop'); void comboEl.offsetWidth; comboEl.classList.add('pop');
    }
    stats.maxMult = Math.max(stats.maxMult, mult());
    popup(x, y, label ? `${label} +${gain}` : `+${gain}`, label ? 38 : 44, false);
  }

  function popup(x, y, text, size, big) {
    popups.push({ x, y, text, size, big, life: big ? 1.6 : 0.9, max: big ? 1.6 : 0.9 });
  }

  function collectOrbs() {
    for (const o of orbs) {
      if (o.taken) continue;
      if ((o.x - head.x) ** 2 + (o.y - head.y) ** 2 < (HEAD_R + 20) ** 2) {
        o.taken = true;
        stats.orbs++;
        award(o.risky ? 40 : 20, o.x, o.y - 30);
        Sound.orb(combo);
        for (let i = 0; i < 14; i++) {
          const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 200;
          particles.push({ x: o.x, y: o.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5, max: 0.5, r: 5 + Math.random() * 4, h: 48, spark: true });
        }
      }
    }
  }

  function closeCalls(w) {
    // Skimming a wall or obstacle without touching it is rewarded, once per approach.
    let clear = head.y - HEAD_R - w.top, cy = w.top;
    if (w.bot - head.y - HEAD_R < clear) { clear = w.bot - head.y - HEAD_R; cy = w.bot; }
    for (const b of blocks) {
      if (b.x > head.x + HEAD_R + NEAR_DIST || b.x + b.w < head.x - HEAD_R - NEAR_DIST) continue;
      const nx = Math.max(b.x, Math.min(head.x, b.x + b.w));
      const ny = Math.max(b.y, Math.min(head.y, b.y + b.h));
      const d = Math.hypot(nx - head.x, ny - head.y) - HEAD_R;
      if (d < clear) { clear = d; cy = ny; }
    }
    if (clear < NEAR_DIST && nearArmed && nearCooldown <= 0) {
      nearArmed = false;
      nearCooldown = 0.6;
      stats.close++;
      award(15, head.x + 30, cy < head.y ? head.y - 50 : head.y + 60, t('close'));
      Sound.near();
      for (let i = 0; i < 8; i++) {
        particles.push({ x: head.x, y: cy, vx: -60 - Math.random() * 120, vy: (Math.random() - 0.5) * 160, life: 0.4, max: 0.4, r: 4 + Math.random() * 3, h: hue + 20, spark: true });
      }
    }
    if (clear > NEAR_DIST * 2.2) nearArmed = true;
  }

  function updateFx(dt) {
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.spark) { p.vy += 700 * dt; p.vx *= 0.985; }
    }
    particles = particles.filter(p => p.life > 0);
    for (const r of rings) { r.r += 420 * dt; r.life -= dt; }
    rings = rings.filter(r => r.life > 0);
    for (const p of popups) { p.y -= (p.big ? 30 : 60) * dt; p.life -= dt; }
    popups = popups.filter(p => p.life > 0);
    for (const o of orbs) o.ph += dt * 4;
    const drift = (state === 'playing' || state === 'menu') ? speed : 40;
    for (const m of motes) {
      m.x -= drift * m.z * dt;
      m.ph += dt;
      m.y += Math.sin(m.ph * 0.8) * 8 * dt;
      if (m.x < -10) { m.x = worldW + 10; m.y = Math.random() * WORLD_H; }
    }
    shake = Math.max(0, shake - 50 * dt);
    flash = Math.max(0, flash - 2.5 * dt);
  }

  function milestone() {
    rings.push({ x: head.x, y: head.y, r: HEAD_R, life: 0.7, max: 0.7 });
    Sound.chime();
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
  }

  // ---------- Rendering ----------
  function ridge(x, s) {
    return 140 + 70 * Math.sin(x * 0.0037 + s) + 40 * Math.sin(x * 0.011 + s * 2.3) + 14 * Math.sin(x * 0.031 + s * 5.1);
  }

  function drawBackground() {
    const W = worldW;
    const bg = ctx.createLinearGradient(0, 0, 0, WORLD_H);
    bg.addColorStop(0, `hsl(${hue}, 45%, 6%)`);
    bg.addColorStop(0.5, `hsl(${hue}, 50%, 10%)`);
    bg.addColorStop(1, `hsl(${hue}, 45%, 6%)`);
    ctx.fillStyle = bg;
    ctx.fillRect(-30, -30, W + 60, WORLD_H + 60);

    // Two parallax layers of distant rock
    [[0.18, 1.3, 11, 1.0], [0.42, 4.7, 15, 0.75]].forEach(([par, seed, light, amp]) => {
      const off = distance * par;
      ctx.fillStyle = `hsl(${hue}, 35%, ${light}%)`;
      for (const dir of [1, -1]) {
        ctx.beginPath();
        const edge = dir === 1 ? -30 : WORLD_H + 30;
        ctx.moveTo(-30, edge);
        for (let x = -30; x <= W + 60; x += 30) {
          const h = ridge(x + off, seed + (dir === 1 ? 0 : 9)) * amp;
          ctx.lineTo(x, dir === 1 ? h : WORLD_H - h);
        }
        ctx.lineTo(W + 60, edge);
        ctx.closePath();
        ctx.fill();
      }
    });
  }

  function wallPath(side, inset) {
    // side: 'top' | 'bot'; inset pushes the line deeper into the rock
    const first = cave[0], last = cave[cave.length - 1];
    const edge = side === 'top' ? -30 : WORLD_H + 30;
    const dir = side === 'top' ? -1 : 1;
    ctx.beginPath();
    ctx.moveTo(first.x, edge);
    for (const s of cave) ctx.lineTo(s.x, s[side] + dir * (inset ? inset + s.r * 10 : 0));
    ctx.lineTo(last.x, edge);
    ctx.closePath();
  }

  function edgeLine(side) {
    ctx.beginPath();
    cave.forEach((s, i) => i ? ctx.lineTo(s.x, s[side]) : ctx.moveTo(s.x, s[side]));
  }

  function shardPath(x, y, c, dir, k) {
    // A crystal anchored inside the rock, pointing toward the open cave but never past the edge.
    const spread = (k - (c.n - 1) / 2) * 0.45 + c.tilt;
    const L = (c.d - 3) * (k === Math.floor(c.n / 2) ? 1 : c.len);
    const tx = x + Math.sin(spread) * L, ty = y + dir * Math.cos(spread) * L;
    const bw = 4 + c.d * 0.12;
    const nx = Math.cos(spread) * bw, ny = -dir * Math.sin(spread) * bw;
    ctx.beginPath();
    ctx.moveTo(x + nx, y + ny);
    ctx.lineTo(tx, ty);
    ctx.lineTo(x - nx, y - ny);
    ctx.lineTo(x - Math.sin(spread) * L * 0.25, y - dir * Math.cos(spread) * L * 0.25);
    ctx.closePath();
  }

  function forEachCrystal(fn) {
    for (const s of cave) {
      if (s.ct) fn(s.x, s.top - s.ct.d, s.ct, 1);
      if (s.cb) fn(s.x, s.bot + s.cb.d, s.cb, -1);
    }
  }

  function drawWalls() {
    for (const side of ['top', 'bot']) {
      // Lit rim near the edge, darker rock behind it
      wallPath(side, 0);
      ctx.fillStyle = `hsl(${hue}, 32%, 30%)`;
      ctx.fill();
      wallPath(side, 14);
      ctx.fillStyle = `hsl(${hue}, 34%, 19%)`;
      ctx.fill();
      wallPath(side, 55);
      ctx.fillStyle = `hsl(${hue}, 38%, 12%)`;
      ctx.fill();
    }
    forEachCrystal((x, y, c, dir) => {
      for (let k = 0; k < c.n; k++) {
        shardPath(x, y, c, dir, k);
        ctx.fillStyle = `hsl(${hue + 40 + c.h}, 85%, ${55 + k * 8}%)`;
        ctx.fill();
      }
    });
    ctx.lineJoin = 'round';
    for (const side of ['top', 'bot']) {
      edgeLine(side);
      ctx.strokeStyle = `hsla(${hue + 20}, 90%, 60%, 0.16)`;
      ctx.lineWidth = 12;
      ctx.stroke();
      ctx.strokeStyle = `hsla(${hue + 20}, 95%, 72%, 0.9)`;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBlocks() {
    for (const b of blocks) {
      roundRect(b.x, b.y, b.w, b.h, 8);
      const g = ctx.createLinearGradient(b.x, 0, b.x + b.w, 0);
      g.addColorStop(0, `hsl(${hue}, 34%, 34%)`);
      g.addColorStop(1, `hsl(${hue}, 36%, 16%)`);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = `hsla(${hue + 20}, 95%, 72%, 0.85)`;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      // facet line
      ctx.strokeStyle = `hsla(${hue + 20}, 80%, 70%, 0.25)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x + b.w * 0.3, b.y + 6);
      ctx.lineTo(b.x + b.w * (0.5 + b.seed * 0.3), b.y + b.h * 0.55);
      ctx.lineTo(b.x + b.w * 0.35, b.y + b.h - 6);
      ctx.stroke();
    }
  }

  function trailY(x) {
    if (!trail.length) return head.y;
    if (x <= trail[0].x) return trail[0].y;
    for (let i = trail.length - 1; i > 0; i--) {
      const a = trail[i - 1], b = trail[i];
      if (x >= a.x) {
        const f = b.x === a.x ? 0 : (x - a.x) / (b.x - a.x);
        return a.y + (b.y - a.y) * f;
      }
    }
    return head.y;
  }

  function drawTrail() {
    if (trail.length < 2) return;
    const g = ctx.createLinearGradient(head.x - TRAIL_LEN, 0, head.x - BODY_LEN * 0.6, 0);
    g.addColorStop(0, `hsla(${WORM_HUE}, 100%, 70%, 0)`);
    g.addColorStop(1, `hsla(${WORM_HUE}, 100%, 72%, 0.55)`);
    ctx.strokeStyle = g;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    let started = false;
    for (const p of trail) {
      if (p.x > head.x - BODY_LEN * 0.6) break;
      started ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
      started = true;
    }
    ctx.stroke();
  }

  function drawWorm() {
    const n = 22;
    const pts = [];
    for (let i = n; i >= 0; i--) {
      const x = head.x - (BODY_LEN * i) / n;
      pts.push({ x, y: trailY(x), f: 1 - i / n });
    }
    // Body, tail first so the head overlaps
    for (const p of pts) {
      const r = HEAD_R * (0.5 + 0.5 * p.f);
      ctx.fillStyle = `hsl(${WORM_HUE + 20 - p.f * 20}, 70%, ${26 + p.f * 12}%)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `hsla(${WORM_HUE}, 100%, 75%, ${0.35 + p.f * 0.4})`;
      ctx.beginPath(); ctx.arc(p.x - r * 0.15, p.y - r * 0.35, r * 0.42, 0, Math.PI * 2); ctx.fill();
    }
    // Head
    const look = Math.max(-1, Math.min(1, vy / MAX_VY));
    ctx.strokeStyle = `hsl(${WORM_HUE}, 80%, 60%)`;
    ctx.lineWidth = 2;
    for (const k of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(head.x + 2, head.y - 10);
      ctx.quadraticCurveTo(head.x + 4 + k * 3, head.y - 26, head.x + 12 + k * 5, head.y - 28 + look * 3);
      ctx.stroke();
    }
    ctx.fillStyle = `hsl(${WORM_HUE}, 75%, 46%)`;
    ctx.beginPath(); ctx.arc(head.x, head.y, HEAD_R + 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `hsl(${WORM_HUE}, 100%, 78%)`;
    ctx.beginPath(); ctx.arc(head.x - 3, head.y - 6, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f4fff0';
    ctx.beginPath(); ctx.arc(head.x + 6, head.y - 3, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0a1a0c';
    ctx.beginPath(); ctx.arc(head.x + 8, head.y - 3 + look * 2.5, 2.8, 0, Math.PI * 2); ctx.fill();
    return pts;
  }

  function drawBestGate() {
    // A curtain of light where your longest run ended
    if (state !== 'playing' && state !== 'over' && state !== 'paused') return;
    if (bestDist <= 0) return;
    const gx = head.x + (bestDist - distance);
    if (gx < -20 || gx > worldW + 20) return;
    const w = caveAt(gx);
    const g = ctx.createLinearGradient(gx - 30, 0, gx + 30, 0);
    g.addColorStop(0, 'hsla(48, 100%, 70%, 0)');
    g.addColorStop(0.5, 'hsla(48, 100%, 72%, 0.28)');
    g.addColorStop(1, 'hsla(48, 100%, 70%, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(gx - 30, w.top, 60, w.bot - w.top);
    ctx.strokeStyle = 'hsla(48, 100%, 75%, 0.8)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 12]);
    ctx.beginPath(); ctx.moveTo(gx, w.top); ctx.lineTo(gx, w.bot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'hsl(48, 100%, 80%)';
    ctx.font = '600 30px Fredoka, "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t('furthest'), gx, w.top + 40);
  }

  function ghostVisible() {
    return ghostOn && mode === 'daily' && ghost && state !== 'menu';
  }

  function drawGhost() {
    if (!ghostVisible()) return;
    const n = 16;
    for (let i = n; i >= 0; i--) {
      const off = (BODY_LEN * i) / n;
      const y = ghostY(distance - off);
      if (y === null) continue;
      const f = 1 - i / n;
      ctx.fillStyle = `hsla(195, 80%, 85%, ${0.12 + f * 0.16})`;
      ctx.beginPath(); ctx.arc(head.x - off, y, HEAD_R * (0.5 + 0.5 * f), 0, Math.PI * 2); ctx.fill();
    }
    // Where the ghost crashed
    const endD = (ghost.ys.length - 1) * GHOST_STEP;
    const ex = head.x + (endD - distance);
    if (ex > -30 && ex < worldW + 30) {
      const ey = ghost.ys[ghost.ys.length - 1];
      ctx.strokeStyle = 'hsla(195, 80%, 85%, 0.55)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(ex - 9, ey - 9); ctx.lineTo(ex + 9, ey + 9);
      ctx.moveTo(ex + 9, ey - 9); ctx.lineTo(ex - 9, ey + 9);
      ctx.stroke();
    }
  }

  function drawPopups() {
    ctx.textAlign = 'center';
    for (const p of popups) {
      const a = Math.min(1, p.life / p.max * 2.5);
      ctx.globalAlpha = a;
      ctx.font = `700 ${p.size}px Fredoka, "Trebuchet MS", sans-serif`;
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(2, 8, 12, 0.7)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.big ? 'hsl(100, 100%, 75%)' : 'hsl(52, 100%, 80%)';
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawLighting() {
    // Darkness everywhere except around the worm's own light
    const R = Math.max(worldW, WORLD_H);
    const lx = head.dead ? head.x : head.x - 40;
    const g = ctx.createRadialGradient(lx, head.y, 60, lx, head.y, R * 0.75);
    g.addColorStop(0, 'rgba(1, 4, 8, 0)');
    g.addColorStop(0.3, 'rgba(1, 4, 8, 0.18)');
    g.addColorStop(1, 'rgba(1, 4, 8, 0.7)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = g;
    ctx.fillRect(-30, -30, worldW + 60, WORLD_H + 60);
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    drawBackground();

    ctx.globalCompositeOperation = 'lighter';
    for (const m of motes) glow(hue + 30, m.x, m.y, m.r * 5, 0.25 + 0.2 * Math.sin(m.ph * 2));
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    drawWalls();
    drawBlocks();
    drawBestGate();
    drawGhost();

    ctx.globalCompositeOperation = 'lighter';
    if (!head.dead) drawTrail();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    let pts = null;
    if (!head.dead) pts = drawWorm();

    drawLighting();

    // Light sources drawn over the darkness so they shine
    ctx.globalCompositeOperation = 'lighter';
    forEachCrystal((x, y, c, dir) => glow(hue + 40 + c.h, x, y + dir * c.d * 0.5, 34 + c.d, 0.55));
    for (const b of blocks) glow(hue + 20, b.x + b.w / 2, b.y + b.h / 2, Math.max(b.w, b.h) * 0.9, 0.3);
    if (pts) {
      for (let i = 0; i < pts.length; i += 3) glow(WORM_HUE, pts[i].x, pts[i].y, 26 + pts[i].f * 16, 0.22);
      const tail = pts[0];
      glow(WORM_HUE - 30, tail.x, tail.y, 46, 0.9);   // glowworms glow at the tail
      glow(WORM_HUE, head.x, head.y, 110, 0.35);
      glow(WORM_HUE, head.x, head.y, 34, 0.5);
      for (const k of [-1, 1]) glow(WORM_HUE, head.x + 12 + k * 5, head.y - 28, 10, 0.9);
    }
    if (ghostVisible()) {
      const gy = ghostY(distance);
      if (gy !== null) glow(195, head.x, gy, 40, 0.3);
    }
    for (const o of orbs) {
      const pulse = 1 + Math.sin(o.ph) * 0.15;
      const r = (o.risky ? 14 : 11) * pulse;
      glow(48, o.x, o.y, r * 5, 0.55);
      ctx.globalAlpha = 1;
      ctx.fillStyle = o.risky ? 'hsl(45, 100%, 82%)' : 'hsl(55, 100%, 88%)';
      ctx.beginPath(); ctx.arc(o.x, o.y, r, 0, Math.PI * 2); ctx.fill();
      if (o.risky) {
        ctx.strokeStyle = `hsla(40, 100%, 70%, ${0.5 + Math.sin(o.ph) * 0.3})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(o.x, o.y, r + 7, 0, Math.PI * 2); ctx.stroke();
      }
    }
    for (const p of particles) {
      const a = p.life / p.max;
      glow(p.h, p.x, p.y, p.r * (p.spark ? 1.5 : 1 + (1 - a)), a * (p.spark ? 1 : 0.45));
    }
    ctx.globalAlpha = 1;
    for (const r of rings) {
      ctx.strokeStyle = `hsla(${WORM_HUE}, 100%, 75%, ${r.life / r.max})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    drawPopups();

    if (flash > 0) {
      ctx.globalAlpha = Math.min(1, flash) * 0.6;
      ctx.fillStyle = `hsl(${WORM_HUE}, 100%, 85%)`;
      ctx.fillRect(-30, -30, worldW + 60, WORLD_H + 60);
      ctx.globalAlpha = 1;
    }
  }

  function loop(time) {
    const dt = Math.min(0.033, (time - lastTime) / 1000 || 0);
    lastTime = time;
    if (state === 'playing' || state === 'menu') update(dt);
    if (state === 'playing') {
      scoreEl.textContent = score;
      const m = mult();
      comboEl.hidden = m < 2;
      if (m >= 2) {
        comboEl.firstChild.nodeValue = `×${m}`;
        comboEl.lastChild.style.transform = `scaleX(${Math.max(0, comboTimer / COMBO_TIME)})`;
      }
      if (!passedFar && bestDist > 0 && distance > bestDist) {
        passedFar = true;
        rings.push({ x: head.x, y: head.y, r: HEAD_R, life: 0.8, max: 0.8 });
        Sound.chime();
      }
    }
    if (state !== 'paused') updateFx(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- States & UI ----------
  const comboEl = $('combo');
  const scoreEl = $('score'), bestEl = $('best'), muteBtn = $('muteBtn'), musicBtn = $('musicBtn');
  const menu = $('menu'), over = $('over'), scoresView = $('scores'), pauseView = $('pause');
  const nameForm = $('nameForm'), nameInput = $('nameInput'), overButtons = $('overButtons');
  let pendingScore = 0, highlightIndex = -1, overTimer = 0;

  function show(el) { [menu, over, scoresView, pauseView].forEach(o => o.classList.toggle('hidden', o !== el)); }
  function updateBest() { const b = bestScore(); bestEl.textContent = b ? `${t('best')} ${b}` : ''; }

  function startGame(m) {
    Sound.init();
    clearTimeout(overTimer);
    mode = m === 'daily' ? 'daily' : 'endless';
    day = todayKey();
    ghost = null;
    if (mode === 'daily') {
      try { ghost = JSON.parse(getItem(ghostKey()) || 'null'); } catch {}
      if (!ghost || !Array.isArray(ghost.ys) || ghost.ys.length < 2) ghost = null;
    }
    state = 'playing';
    resetWorld(mode === 'daily' ? hashString('glowworm:' + day) : undefined);
    pressing = false;
    show(null);
    scoreEl.hidden = false;
    scoreEl.textContent = '0';
    comboEl.hidden = true;
    updateBest();
    Sound.mood(0.09, true);
  }

  function pauseGame() {
    state = 'paused';
    pressing = false;
    Sound.thrust(false, 0);
    show(pauseView);
  }
  function resumeGame() {
    Sound.init();
    state = 'playing';
    show(null);
  }

  function gameOver() {
    state = 'over';
    pressing = false;
    head.dead = true;
    shake = 22;
    flash = 0.6;
    for (let i = 0; i < 60; i++) {
      const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 420;
      particles.push({ x: head.x, y: head.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1.1, max: 1.1, r: 6 + Math.random() * 8, h: WORM_HUE + (Math.random() - 0.5) * 60, spark: true });
    }
    // The body scatters into light too
    for (let i = 0; i < 12; i++) {
      const x = head.x - (BODY_LEN * i) / 12;
      particles.push({ x, y: trailY(x), vx: (Math.random() - 0.5) * 120, vy: -60 - Math.random() * 80, life: 1.4, max: 1.4, r: 10, h: WORM_HUE, spark: true });
    }
    Sound.crash();
    Sound.mood(0.03);
    Sound.intensity(0);
    if (mode === 'daily' && ghostRec.length > 1 && (!ghost || score > ghost.score)) {
      setItem(ghostKey(), JSON.stringify({ score, ys: ghostRec }));
    }
    $('overMode').textContent = mode === 'daily' ? `${t('daily')} · ${$('dailyDate').textContent}` : t('endless');
    if (navigator.vibrate) navigator.vibrate(150);

    pendingScore = score;
    comboEl.hidden = true;
    $('finalScore').textContent = score;
    $('stats').textContent = `${t('orbs')} ${stats.orbs} · ${t('closeCalls')} ${stats.close} · ${t('maxCombo')} ×${stats.maxMult}`;
    if (distance > bestDist) { bestDist = Math.round(distance); setItem(distKey(mode), String(bestDist)); }
    const isBest = score > 0 && score > bestScore();
    const isTop = qualifies(score);
    $('newBest').hidden = !isBest;
    nameForm.hidden = !isTop;
    overButtons.hidden = isTop;
    // Short delay so lifting the finger doesn't hit a button straight away.
    overTimer = setTimeout(() => {
      show(over);
      if (isBest && !passedBest) Sound.fanfare();
      if (isTop) {
        nameInput.value = getItem(LAST_NAME_KEY) || '';
        nameInput.focus();
        nameInput.select();
      }
    }, 700);
  }

  function saveName() {
    const name = (nameInput.value.trim() || t('anon')).slice(0, 16);
    setItem(LAST_NAME_KEY, name);
    highlightIndex = addScore(name, pendingScore);
    nameInput.blur();
    updateBest();
    showScores(mode);
  }

  let viewMode = 'endless';
  function showScores(m) {
    viewMode = m === 'daily' ? 'daily' : 'endless';
    $('tabEndless').classList.toggle('active', viewMode === 'endless');
    $('tabDaily').classList.toggle('active', viewMode === 'daily');
    const list = loadScores(viewMode);
    const ol = $('scoreList');
    ol.innerHTML = '';
    if (!list.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = t('empty');
      ol.appendChild(empty);
    }
    list.forEach((e, i) => {
      const li = document.createElement('li');
      if (i === highlightIndex) li.className = 'me';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = e.name;
      const s = document.createElement('span'); s.className = 's'; s.textContent = e.score;
      li.append(n, s);
      ol.appendChild(li);
    });
    highlightIndex = -1;
    show(scoresView);
  }

  function backToMenu() {
    state = 'menu';
    Sound.intensity(0);
    scoreEl.hidden = true;
    comboEl.hidden = true;
    resetWorld();
    show(menu);
    Sound.mood(0.04);
  }

  function syncMute() {
    muteBtn.classList.toggle('muted', Sound.muted);
    musicBtn.classList.toggle('muted', !Sound.musicOn);
  }

  function syncChips() {
    const ghostBtn = $('ghostBtn'), styleBtn = $('styleBtn');
    ghostBtn.textContent = `${t('ghost')}: ${ghostOn ? t('on') : t('off')}`;
    ghostBtn.classList.toggle('active', ghostOn);
    styleBtn.textContent = `${t('music')}: ${Sound.style === 'rising' ? t('rising') : t('calm')}`;
    styleBtn.classList.toggle('active', Sound.style === 'rising');
  }

  $('startBtn').addEventListener('click', () => startGame('endless'));
  $('dailyBtn').addEventListener('click', () => startGame('daily'));
  $('scoresBtn').addEventListener('click', () => showScores(mode));
  $('againBtn').addEventListener('click', () => startGame(mode));
  $('overScoresBtn').addEventListener('click', () => showScores(mode));
  $('scoresPlayBtn').addEventListener('click', () => startGame(viewMode));
  $('tabEndless').addEventListener('click', () => showScores('endless'));
  $('tabDaily').addEventListener('click', () => showScores('daily'));
  $('ghostBtn').addEventListener('click', () => { ghostOn = !ghostOn; setItem(GHOST_KEY, ghostOn ? '1' : '0'); syncChips(); });
  $('styleBtn').addEventListener('click', () => { Sound.setStyle(Sound.style === 'rising' ? 'calm' : 'rising'); syncChips(); });
  $('scoresBackBtn').addEventListener('click', backToMenu);
  $('saveBtn').addEventListener('click', saveName);
  $('langBtn').addEventListener('click', () => {
    lang = lang === 'en' ? 'fi' : 'en';
    setItem(LANG_KEY, lang);
    applyLang();
  });
  pauseView.addEventListener('pointerdown', e => { e.preventDefault(); resumeGame(); });
  muteBtn.addEventListener('click', () => { Sound.init(); Sound.setMuted(!Sound.muted); syncMute(); });
  musicBtn.addEventListener('click', () => { Sound.init(); Sound.setMusic(!Sound.musicOn); syncMute(); });
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); e.stopPropagation(); });
  document.addEventListener('click', e => {
    if (e.target.closest('button')) { Sound.init(); if (!e.target.closest('.icon-btn')) Sound.click(); }
  });
  // Start the menu ambience on the first touch anywhere
  document.addEventListener('pointerdown', () => { Sound.init(); if (state === 'menu') Sound.mood(0.04); }, { once: true });

  window.addEventListener('resize', resize);
  pruneOldDays();
  applyLang();
  syncMute();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
